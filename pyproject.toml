[project]
name = "duckbill"
version = "0.1.0"
description = "Monzo ingestion and dbt transforms for the duckbill dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    "duckdb>=1.3",
]

[project.scripts]
duckbill = "duckbill_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest/duckbill_ingest"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["ingest/tests"]

[tool.ruff]
line-length = 100
