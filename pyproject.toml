[project]
name = "duckbill"
version = "0.1.0"
description = "Monzo ingestion and dbt transforms for the duckbill dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    # MotherDuck only accepts DuckDB 1.x clients (1.5.6 at most, Nov 2026).
    # Move to 2.x once https://motherduck.com/docs/about-motherduck/cloud-regions/ lists it.
    "duckdb==1.5.6",
    "boto3>=1.40",
]

[project.scripts]
duckbill = "duckbill_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest/duckbill_ingest"]

[dependency-groups]
dev = [
    "moto[s3,ssm]>=5.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["ingest/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Defaults plus import order (I), likely bugs (B) and modern syntax (UP).
extend-select = ["I", "B", "UP"]

# `pnpm typecheck` runs it (from the root package.json), against uv's .venv.
[tool.pyright]
# Tests use untyped fakes in place of the real clients, so only shipped code is checked.
include = ["ingest/duckbill_ingest", "deploy", "scripts"]
# Setting exclude replaces pyright's defaults, so they're listed too. cdk.out holds
# CDK's staged copies of the repo after a synth or diff.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "deploy/cdk/cdk.out"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
