# `duckbill transform` picks the target: `local` reads raw from disk, `s3` reads
# it from S3 with credentials from the AWS chain (env vars, profile or IAM role).
# The warehouse itself is always a local file.
duckbill:
  target: "{{ env_var('DUCKBILL_DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('DUCKBILL_DATA_DIR') }}/warehouse.duckdb"
      threads: 4
    s3:
      type: duckdb
      path: "{{ env_var('DUCKBILL_DATA_DIR') }}/warehouse.duckdb"
      threads: 4
      extensions: [httpfs, aws]
      secrets:
        - type: s3
          provider: credential_chain
